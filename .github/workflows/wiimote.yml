name: Wiimote native backend

on:
  push:
    branches:
      - feature/native-wiimote-4p
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DHOTD_FETCH_SDL3=ON
          -DHOTD_LOCAL_ICON=OFF
          -DHOTD_ARCADE_SOUND=OFF
          -DHOTD_EXPERIMENTAL_MODES=OFF
          -DHOTD_FETCH_STB=ON
      - name: Build
        run: cmake --build build --config Release --parallel --target hotd hotd_viewer hotd_launch hotd_wiimote_test
      - name: Protocol and calibration tests
        shell: pwsh
        run: .\build\Release\hotd_wiimote_test.exe
      - name: Package portable build
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "pkg\HOTD ReWrithe"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\make_portable_hotd.ps1 -Build build -Out $out -NoBuild
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE "pkg\docs") | Out-Null
          Copy-Item docs\wiimotes.md (Join-Path $env:GITHUB_WORKSPACE "pkg\docs\WIIMOTES.txt")
          $map = Get-ChildItem -Path build -Filter hotd.map -Recurse | Select-Object -First 1
          if (-not $map) { throw "hotd.map was not generated by the Windows linker" }
          Copy-Item $map.FullName (Join-Path $env:GITHUB_WORKSPACE "pkg\docs\hotd.map")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-wiimote
          path: |
            pkg/*.zip
            pkg/SHA256SUMS.txt
            pkg/docs/WIIMOTES.txt
            pkg/docs/hotd.map
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DHOTD_FETCH_SDL3=ON
          -DHOTD_LOCAL_ICON=OFF
          -DHOTD_ARCADE_SOUND=OFF
          -DHOTD_EXPERIMENTAL_MODES=OFF
          -DHOTD_FETCH_STB=ON
          -DHOTD_STATIC_CXX_RUNTIME=OFF
      - name: Build
        run: cmake --build build --parallel --target hotd hotd_viewer hotd_wiimote_test
      - name: Protocol and calibration tests
        run: ./build/hotd_wiimote_test
      - name: Package portable build
        run: |
          set -euo pipefail
          bash tools/make_linux_package.sh -b build -o "$GITHUB_WORKSPACE/pkg/HOTD ReWrithe Linux" --no-build
          mkdir -p "$GITHUB_WORKSPACE/pkg/docs"
          cp docs/wiimotes.md "$GITHUB_WORKSPACE/pkg/docs/WIIMOTES.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-wiimote
          path: |
            pkg/*.tar.gz
            pkg/SHA256SUMS-linux.txt
            pkg/docs/WIIMOTES.txt
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DHOTD_FETCH_SDL3=ON
          -DHOTD_LOCAL_ICON=OFF
          -DHOTD_ARCADE_SOUND=OFF
          -DHOTD_EXPERIMENTAL_MODES=OFF
          -DHOTD_FETCH_STB=ON
          -DHOTD_STATIC_CXX_RUNTIME=OFF
      - name: Build
        run: cmake --build build --parallel --target hotd hotd_viewer hotd_wiimote_test
      - name: Protocol and calibration tests
        run: ./build/hotd_wiimote_test
      - name: Package portable build
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)"
          root="$GITHUB_WORKSPACE/pkg"
          out="$root/HOTD ReWrithe macOS"
          mkdir -p "$out/bin"
          cp build/hotd build/hotd_viewer "$out/bin/"
          sdl="$(find build/_deps -name 'libSDL3.0.dylib' -print -quit)"
          test -n "$sdl"
          cp -L "$sdl" "$out/bin/libSDL3.0.dylib"
          for d in ui fonts lang mods typing; do
            if [ -d "data/$d" ]; then
              mkdir -p "$out/data/$d"
              cp -R "data/$d/." "$out/data/$d/"
            fi
          done
          mkdir -p "$out/data/arcade" "$out/data/pc" "$out/data/music"
          echo "Put your own arcade ROM zip here (MAME's 'hotd' set, Revision A)." > "$out/data/arcade/put the arcade ROM zip here.txt"
          echo "Put your own 1998 PC game here (its installed folder's contents, or a .zip of it)." > "$out/data/pc/put the PC game here.txt"
          echo "Optional: PC CD music, Track02.ogg ... Track12.ogg (or .mp3)." > "$out/data/music/put the music here.txt"
          cp LICENSE "$out/LICENSE.txt"
          cp NOTICE.md "$out/NOTICE.txt"
          cp CHANGELOG.md "$out/CHANGELOG.txt"
          cp README.md "$out/README.md"
          cp docs/wiimotes.md "$out/WIIMOTES.txt"
          cat > "$out/hotd.command" <<'EOS'
          #!/bin/sh
          cd "$(dirname "$0")" || exit 1
          exec ./bin/hotd "$@"
          EOS
          cat > "$out/hotd-setup.command" <<'EOS'
          #!/bin/sh
          cd "$(dirname "$0")" || exit 1
          exec ./bin/hotd --setup "$@"
          EOS
          cat > "$out/hotd-viewer.command" <<'EOS'
          #!/bin/sh
          cd "$(dirname "$0")" || exit 1
          exec ./bin/hotd_viewer "$@"
          EOS
          cat > "$out/HOW TO OPEN.txt" <<'EOS'
          macOS 11 or newer, Apple Silicon (arm64). This package is not signed by Apple.
          Unzip the folder and move it where you want. If macOS blocks the downloaded files,
          open Terminal and run: xattr -dr com.apple.quarantine "<path to HOTD ReWrithe macOS>".
          Then run hotd.command (or hotd-setup.command) from the folder.
          Supply your own arcade ROM and/or 1998 PC game in data/arcade and data/pc.
          EOS
          chmod +x "$out/hotd.command" "$out/hotd-setup.command" "$out/hotd-viewer.command" "$out/bin/hotd" "$out/bin/hotd_viewer"
          codesign --force -s - "$out/bin/libSDL3.0.dylib" "$out/bin/hotd" "$out/bin/hotd_viewer"
          otool -L "$out/bin/hotd" | grep -q "@rpath/libSDL3"
          otool -l "$out/bin/hotd" | grep -A2 LC_RPATH | grep -q "@loader_path"
          (cd "$out" && HOTD_PREF_DIR="$RUNNER_TEMP/pref_pkg" ./bin/hotd --version)
          (cd "$root" && ditto -c -k --keepParent "HOTD ReWrithe macOS" "hotd-rewrithe-v${ver}-macos-arm64.zip")
          (cd "$root" && shasum -a 256 "hotd-rewrithe-v${ver}-macos-arm64.zip" > SHA256SUMS-macos.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-wiimote
          path: |
            pkg/*.zip
            pkg/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14
